<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema de Treinos</title>
    <link rel="stylesheet" href="styles.css" />
    <script defer src="https://unpkg.com/lucide@latest"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body>
    <section class="login-overlay" id="loginOverlay" hidden>
      <form class="login-panel" id="loginForm">
        <div class="brand-mark">ST</div>
        <h1>Sistema de Treinos</h1>
        <label>
          Senha do professor
          <input id="loginPassword" type="password" placeholder="Senha" autocomplete="current-password" />
        </label>
        <button class="primary" type="submit">
          <i data-lucide="log-in"></i>
          Entrar
        </button>
        <p id="loginError" class="login-error"></p>
      </form>
    </section>

    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">ST</div>
          <div>
            <h1>Sistema de Treinos</h1>
            <p>Monte, revise e gere treinos em Word.</p>
          </div>
        </div>

        <section class="panel">
          <div class="panel-title">
            <i data-lucide="user-round"></i>
            <h2>Dados</h2>
          </div>

          <label>
            Aluno cadastrado
            <select id="studentSelect">
              <option value="">Selecionar aluno</option>
            </select>
          </label>

          <div class="inline-actions">
            <button id="newStudentBtn" class="secondary" type="button">
              <i data-lucide="user-plus"></i>
              Novo
            </button>
            <button id="saveStudentBtn" class="secondary" type="button">
              <i data-lucide="save"></i>
              Salvar aluno
            </button>
          </div>

          <label>
            Nome do aluno
            <input id="studentName" type="text" placeholder="Nome do aluno" />
          </label>

          <label>
            Contato
            <input id="studentContact" type="text" placeholder="Telefone ou WhatsApp" />
          </label>

          <label>
            Objetivo
            <input id="studentGoal" type="text" placeholder="Ex.: Hipertrofia, emagrecimento..." />
          </label>

          <label>
            Nivel
            <select id="studentLevel">
              <option value="iniciante">Iniciante</option>
              <option value="intermediario">Intermediario</option>
              <option value="avancado">Avancado</option>
            </select>
          </label>

          <label>
            Observacoes do aluno
            <textarea id="studentNotes" rows="3" placeholder="Restricoes, preferencias, historico..."></textarea>
          </label>

          <div class="field-grid">
            <label>
              Peso
              <input id="studentWeight" type="text" placeholder="Ex.: 78 kg" />
            </label>

            <label>
              Altura
              <input id="studentHeight" type="text" placeholder="Ex.: 1,75 m" />
            </label>
          </div>

          <div class="field-grid">
            <label>
              Gordura
              <input id="studentBodyFat" type="text" placeholder="Ex.: 18%" />
            </label>

            <label>
              Avaliacao
              <input id="studentAssessmentDate" type="date" />
            </label>
          </div>

          <label>
            Medidas
            <textarea id="studentMeasurements" rows="3" placeholder="Ex.: cintura 82 cm, quadril 98 cm..."></textarea>
          </label>

          <button id="deleteStudentBtn" class="danger full-action" type="button">
            <i data-lucide="trash-2"></i>
            Excluir aluno
          </button>

          <label>
            Professor
            <input id="teacherName" type="text" placeholder="Nome do professor" />
          </label>

          <label>
            Titulo do treino
            <input id="workoutTitle" type="text" placeholder="Ex.: Treino masculino 5 dias" />
          </label>

          <label>
            Divisao
            <select id="workoutProfile">
              <option value="personalizado">Personalizado</option>
              <option value="3-dias">3 dias</option>
              <option value="5-dias">5 dias</option>
              <option value="superiores-inferiores">Superiores / inferiores</option>
              <option value="abc">ABC</option>
            </select>
          </label>

          <label>
            Layout do Word
            <select id="docxLayout">
              <option value="simples">Simples</option>
              <option value="compacto">Compacto</option>
              <option value="detalhado">Detalhado</option>
            </select>
          </label>

          <label>
            Status do treino
            <select id="workoutStatus">
              <option value="rascunho">Rascunho</option>
              <option value="ativo">Ativo</option>
              <option value="pausado">Pausado</option>
              <option value="encerrado">Encerrado</option>
            </select>
          </label>

          <div class="field-grid">
            <label>
              Inicio
              <input id="workoutStartDate" type="date" />
            </label>

            <label>
              Fim
              <input id="workoutEndDate" type="date" />
            </label>
          </div>

          <label>
            Treino salvo
            <select id="workoutSelect">
              <option value="">Treino atual</option>
            </select>
          </label>

          <div class="inline-actions">
            <button id="newWorkoutBtn" class="secondary" type="button">
              <i data-lucide="file-plus-2"></i>
              Novo treino
            </button>
            <button id="saveWorkoutBtn" class="secondary" type="button">
              <i data-lucide="folder-check"></i>
              Salvar treino
            </button>
          </div>

          <button id="duplicateWorkoutBtn" class="secondary full-action" type="button">
            <i data-lucide="copy-plus"></i>
            Duplicar treino
          </button>

          <div class="history-box" id="workoutHistory"></div>

          <label>
            Observacoes gerais
            <textarea id="generalNotes" rows="4" placeholder="Ex.: 3x entre 10 a 15 repeticoes"></textarea>
          </label>
        </section>

        <section class="panel">
          <div class="panel-title">
            <i data-lucide="dumbbell"></i>
            <h2>Biblioteca</h2>
          </div>

          <label>
            Buscar exercicio
            <input id="libraryExerciseSearch" type="search" placeholder="Digite para filtrar..." />
          </label>

          <label>
            Exercicio cadastrado
            <select id="libraryExerciseSelect">
              <option value="">Novo exercicio</option>
            </select>
          </label>

          <label>
            Nome do exercicio
            <input id="libraryExerciseName" type="text" placeholder="Ex.: SUPINO RETO" />
          </label>

          <label>
            Grupo muscular
            <select id="libraryExerciseGroup">
              <option value="Peito">Peito</option>
              <option value="Costas">Costas</option>
              <option value="Pernas">Pernas</option>
              <option value="Ombros">Ombros</option>
              <option value="Bracos">Bracos</option>
              <option value="Abdomen">Abdomen</option>
              <option value="Gluteos">Gluteos</option>
              <option value="Panturrilha">Panturrilha</option>
              <option value="Mobilidade">Mobilidade</option>
              <option value="Outros">Outros</option>
            </select>
          </label>

          <label>
            Equipamento
            <select id="libraryExerciseEquipment">
              <option value="Maquina">Maquina</option>
              <option value="Halter">Halter</option>
              <option value="Barra">Barra</option>
              <option value="Polia">Polia</option>
              <option value="Peso corporal">Peso corporal</option>
              <option value="Cardio">Cardio</option>
              <option value="Livre">Livre</option>
              <option value="Outros">Outros</option>
            </select>
          </label>

          <div class="inline-actions">
            <button id="newExerciseBtn" class="secondary" type="button">
              <i data-lucide="plus"></i>
              Novo
            </button>
            <button id="saveExerciseBtn" class="secondary" type="button">
              <i data-lucide="save"></i>
              Salvar
            </button>
          </div>

          <button id="deleteExerciseBtn" class="danger full-action" type="button">
            <i data-lucide="trash-2"></i>
            Excluir exercicio
          </button>
        </section>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div>
            <p class="eyebrow">Editor</p>
            <h2 id="screenTitle">Treino sem titulo</h2>
          </div>
          <div class="topbar-actions">
            <button id="addDayBtn" class="secondary" type="button">
              <i data-lucide="calendar-plus"></i>
              Dia
            </button>
            <button id="saveBtn" class="secondary" type="button" title="Salvar no navegador">
              <i data-lucide="save"></i>
              Salvar
            </button>
            <button id="previewBtn" class="secondary" type="button">
              <i data-lucide="eye"></i>
              Preview
            </button>
            <button id="downloadBtn" class="primary" type="button">
              <i data-lucide="download"></i>
              DOCX
            </button>
          </div>
        </header>

        <section class="day-nav" aria-label="Dias do treino">
          <div class="day-tabs" id="dayTabs"></div>
          <button id="increaseDayBtn" class="secondary compact-action" type="button">
            <i data-lucide="plus"></i>
            Dia
          </button>
        </section>
        <section class="editor-grid" id="daysContainer"></section>
        <section class="preview-panel" id="previewPanel" hidden></section>
      </main>
    </div>
  </body>
</html>
